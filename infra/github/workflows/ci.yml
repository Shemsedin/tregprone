name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scaffold/package-lock.json
      - run: npm ci
        working-directory: scaffold
      - run: npm run lint
        working-directory: scaffold
      - run: npm run typecheck
        working-directory: scaffold

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: treg
          POSTGRES_PASSWORD: treg
          POSTGRES_DB: tregtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5
    env:
      DATABASE_URL: postgresql://treg:treg@localhost:5432/tregtest
      REDIS_URL: redis://localhost:6379
      JWT_ED_PRIVATE_KEY: ""
      JWT_ED_PUBLIC_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scaffold/package-lock.json
      - run: npm ci
        working-directory: scaffold
      - run: npx prisma migrate deploy
        working-directory: scaffold/packages/db
        env:
          DATABASE_URL: postgresql://treg:treg@localhost:5432/tregtest
      - run: npm test --workspaces --if-present
        working-directory: scaffold

  build:
    name: Build Images
    runs-on: ubuntu-24.04
    needs: [lint-and-typecheck, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: scaffold
          file: scaffold/apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: scaffold
          file: scaffold/apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: scaffold
          file: scaffold/apps/worker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
